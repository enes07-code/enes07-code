<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HOSHI: Gothic Rain</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#eee;font-family:system-ui,-apple-system,sans-serif}canvas{width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;left:16px;top:14px;padding:11px 14px;background:#080b18d9;border:1px solid #a6b7ff55;border-radius:10px;box-shadow:0 0 28px #070a1b;font-size:12px;letter-spacing:.05em;pointer-events:none}#hud strong{letter-spacing:.25em;color:#f0edff;font-size:14px}#hud small{display:block;color:#c0c8e9;margin-top:3px}
#help{position:fixed;right:14px;top:14px;padding:10px 13px;background:#080b18c9;border:1px solid #a6b7ff44;border-radius:9px;color:#d7dcf5;font-size:12px;line-height:1.5;pointer-events:none}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#03050c66;backdrop-filter:blur(2px)}#panel{width:min(440px,calc(100% - 32px));padding:27px 28px;text-align:center;background:#080b18ed;border:1px solid #b6b9ee66;border-radius:14px;box-shadow:0 18px 90px #0009}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.22em;margin:0 0 7px;color:#f5f1ff}p{font-size:14px;line-height:1.55;color:#c7cce7}button{border:1px solid #c4c8ff;background:#191d3a;color:#fff;border-radius:8px;padding:11px 22px;font-weight:700;letter-spacing:.1em}
#mobile{position:fixed;left:12px;bottom:12px;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px);gap:4px}#mobile button{padding:0;font-size:17px;background:#11152bd9;border-color:#c3c6ff99;touch-action:none}#mobile span{display:block}
@media(pointer:coarse){#mobile{display:grid}#help{top:auto;bottom:15px;right:12px;max-width:145px;font-size:11px}#hud{top:10px;left:10px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><strong>H O S H I</strong><small>GOTHIC RAIN · BUILD 02</small><small id="state">Hazır · WASD ile keşfet</small></div>
<div id="help">W A S D / oklar: hareket<br>Shift: hızlı yürüme<br>ESC: menüyü aç/kapat</div>
<div id="mobile"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
<div id="start"><div id="panel"><h1>HOSHI</h1><p>Yağmurun altında, eski kalenin avlusunda yalnız bir yolculuk.</p><p><b>W A S D</b> veya ok tuşlarıyla hareket et. <b>Shift</b> daha hızlı yürümeni sağlar.</p><button id="play">OYUNA BAŞLA</button></div></div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const bg=new Image();bg.src='assets/gothic_courtyard.jpg';
const frames=Array.from({length:8},(_,i)=>{let im=new Image();im.src=`assets/walk_${i}.png`;return im});
const keys={};let w=0,h=0,dpr=1,last=0,t=0,started=false,menu=true;
const p={x:0.5,y:.78,dir:1,walking:false,phase:0,step:0};
const rain=Array.from({length:230},()=>({x:Math.random(),y:Math.random(),v:.3+Math.random()*.8,len:3+Math.random()*8,depth:.25+Math.random()*.75}));
const fog=Array.from({length:7},(_,i)=>({x:i/7,y:.68+Math.random()*.24,s:.035+Math.random()*.05,a:.04+Math.random()*.05}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr)}addEventListener('resize',resize);resize();
function drawBg(){
 ctx.fillStyle='#080b19';ctx.fillRect(0,0,w,h);
 if(bg.complete&&bg.naturalWidth){
   const iw=bg.naturalWidth,ih=bg.naturalHeight,sc=Math.max(w/iw,h/ih),dw=iw*sc,dh=ih*sc;
   const travel=Math.max(0,dw-w),cx=travel*.12+Math.sin(t*.035)*travel*.018;
   ctx.drawImage(bg,-cx,(h-dh)*.5,dw,dh);
 } else {ctx.fillStyle='#171b31';ctx.fillRect(0,0,w,h)}
 // cool atmospheric color wash
 const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#121a3544');grad.addColorStop(.65,'#11152a16');grad.addColorStop(1,'#090d1b55');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 // layered drifting mist
 for(const f of fog){let fx=((f.x+t*.003*f.s*12)%1)*w;ctx.fillStyle=`rgba(170,188,224,${f.a})`;ctx.beginPath();ctx.ellipse(fx,f.y*h,f.s*w*.9,7+f.s*h*.12,0,0,Math.PI*2);ctx.fill()}
 // puddle ripples and reflections
 for(let i=0;i<30;i++){let xx=((i*83+t*5)%(w+40))-20,yy=h*.86+(i*19%Math.max(1,h*.12));ctx.fillStyle=i%3?'#a6b9e51b':'#d99be42b';ctx.fillRect(xx,yy,12+(i%4)*6,1);if(i%4===0)ctx.fillRect(xx+4,yy+2,7,1)}
}
function drawRain(dt){
 for(const r of rain){r.x-=dt*.08*r.depth;r.y+=dt*r.v*1.2*r.depth;if(r.y>1){r.y=-.03;r.x=Math.random()*1.1}if(r.x<0)r.x=1}
 ctx.lineWidth=.7;for(const r of rain){let x=r.x*w,y=r.y*h;ctx.strokeStyle=`rgba(177,201,239,${.15+r.depth*.34})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3*r.depth,y+r.len*r.depth);ctx.stroke()}
}
function drawSword(x,y,scale,dir,walking){
 ctx.save();ctx.translate(x+dir*scale*.16,y+scale*.02);ctx.scale(dir*scale,scale);
 // sword trails slightly while walking; blade aligned to the character's hand
 ctx.rotate(.36+Math.sin(p.phase*1.3)*.035*(walking?1:0));
 // pommel and dark grip
 ctx.fillStyle='#3a3449';ctx.fillRect(-2,-.02,4,15);ctx.fillStyle='#b9c5e4';ctx.fillRect(-3,0,6,2);ctx.fillStyle='#5a5269';ctx.fillRect(-2,3,4,8);
 // ornate silver guard
 ctx.fillStyle='#bfc9e8';ctx.beginPath();ctx.moveTo(-12,10);ctx.lineTo(-9,6);ctx.lineTo(-4,10);ctx.lineTo(0,8);ctx.lineTo(4,10);ctx.lineTo(9,6);ctx.lineTo(12,10);ctx.lineTo(8,14);ctx.lineTo(2,12);ctx.lineTo(0,15);ctx.lineTo(-2,12);ctx.lineTo(-8,14);ctx.closePath();ctx.fill();
 // broad blade, silver edge + dark engraving
 ctx.fillStyle='#8996b6';ctx.beginPath();ctx.moveTo(-3,12);ctx.lineTo(3,12);ctx.lineTo(2,54);ctx.lineTo(0,66);ctx.lineTo(-2,54);ctx.closePath();ctx.fill();
 ctx.fillStyle='#eef2ff';ctx.beginPath();ctx.moveTo(-2,14);ctx.lineTo(0,15);ctx.lineTo(0,61);ctx.lineTo(-1,54);ctx.closePath();ctx.fill();
 ctx.fillStyle='#606b8d';ctx.fillRect(0,20,1,25);ctx.fillStyle='#e5dff7';ctx.fillRect(-1,26,2,1);ctx.fillRect(-1,35,2,1);ctx.restore();
}
function drawHero(){
 const scale=(.25+p.y*.04)*Math.min(w/1000,h/560)*1.8;
 const sprite=frames[Math.floor(p.phase)%frames.length];
 const x=p.x*w,y=p.y*h;
 // soft contact shadow and cold rim light
 ctx.fillStyle='#05071188';ctx.beginPath();ctx.ellipse(x,y+scale*77,scale*28,scale*7,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.globalAlpha=.16;ctx.fillStyle='#93c7ff';ctx.beginPath();ctx.ellipse(x,y+scale*25,scale*36,scale*55,0,0,Math.PI*2);ctx.fill();ctx.restore();
 // sword first so it sits behind the heroine
 drawSword(x,y+scale*5,scale*.92,p.dir,p.walking);
 if(sprite.complete&&sprite.naturalWidth){
   ctx.save();ctx.translate(x,y);ctx.scale(p.dir,1);
   const sw=192*scale,sh=256*scale;
   ctx.drawImage(sprite,-sw*.5,-sh*.91,sw,sh);
   ctx.restore();
 }else{
   ctx.fillStyle='#111322';ctx.fillRect(x-12,y-30,24,38);ctx.fillStyle='#f1eefa';ctx.fillRect(x-8,y-53,16,21);ctx.fillStyle='#d5deef';ctx.fillRect(x-12,y-57,23,7);
 }
}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);drawBg();drawRain(Math.min(.04,(performance.now()-last)/1000||.016));drawHero();if(!started){ctx.fillStyle='#05071425';ctx.fillRect(0,0,w,h)}}
function update(dt){t+=dt;let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;p.walking=!!(dx||dy);if(p.walking){let len=Math.hypot(dx,dy),speed=(keys.shift?0.29:0.18);p.x+=dx/len*speed*dt;p.y+=dy/len*speed*dt;p.phase+=dt*(keys.shift?13:9);if(dx)p.dir=dx<0?-1:1;}p.x=Math.max(.06,Math.min(.94,p.x));p.y=Math.max(.48,Math.min(.88,p.y));document.getElementById('state').textContent=p.walking?'Yürüyor · '+(p.dir<0?'sola':'sağa'):'Hazır · WASD ile keşfet'}
function loop(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}
function start(){started=true;menu=false;document.getElementById('start').style.display='none'}
document.getElementById('play').onclick=start;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='escape'){menu=!menu;document.getElementById('start').style.display=menu?'grid':'none';started=!menu}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
requestAnimationFrame(loop);
})();
</script></body></html>
