<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hoshi Gothic Rain</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a14;color:#eee;font-family:system-ui}canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated;touch-action:none}#hud,#hint{position:fixed;padding:10px 13px;background:#090b18d9;border:1px solid #7778a366;border-radius:8px;font-size:12px;color:#d8daf0}#hud{top:12px;left:12px}#hint{right:12px;bottom:12px}#start{position:fixed;inset:0;display:grid;place-items:center;background:#05061199}#panel{padding:26px;text-align:center;max-width:420px;margin:20px;background:#090b18ee;border:1px solid #a4a8dd88;border-radius:12px}h1{font-family:Georgia,serif;letter-spacing:.2em;font-weight:400}p{color:#c5c8e1;line-height:1.5;font-size:14px}button{background:#171b35;color:white;border:1px solid #b9bde5;border-radius:7px;padding:10px 18px;font-weight:bold}#mobile{position:fixed;left:12px;bottom:12px;display:none;grid-template-columns:repeat(3,44px);gap:4px}#mobile button{padding:0;height:40px;touch-action:none}@media(pointer:coarse){#mobile{display:grid}#hint{bottom:112px;max-width:150px}}
</style></head><body><canvas id="c"></canvas><div id="hud"><b>H O S H I</b><br><span id="status">Gothic Rain · Prototype 01</span></div><div id="hint">W A S D / ok tuşları: hareket<br>Shift: hızlı yürüme</div><div id="mobile"><i></i><button data-k="w">▲</button><i></i><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><div id="start"><div id="panel"><h1>HOSHI</h1><p>Yağmurun hiç dinmediği eski kaleye hoş geldin. Şimdilik keşfet: WASD ile yürü, atmosferi incele.</p><p><b>W A S D</b> veya ok tuşları · <b>Shift</b> hızlı hareket</p><button id="play">OYUNA BAŞLA</button></div></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),W=480,H=270;let t=0,last=0,run=false;const k={},p={x:240,y:173,dir:'down',walk:0,m:false};const rain=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,v:1+Math.random()*2.5,l:2+Math.random()*5}));function resize(){c.width=innerWidth*Math.min(devicePixelRatio||1,2);c.height=innerHeight*Math.min(devicePixelRatio||1,2)}addEventListener('resize',resize);resize();function r(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11162b');g.addColorStop(.6,'#34384a');g.addColorStop(1,'#171b29');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#c6d1df';x.beginPath();x.arc(350,39,19,0,7);x.fill();for(let i=0;i<11;i++){let a=i*48-12,h=35+(i*31%60);r(a,80-h/2,15,h,'#161a2c');x.fillStyle='#161a2c';x.beginPath();x.moveTo(a-3,80-h/2);x.lineTo(a+7,60-h/2);x.lineTo(a+18,80-h/2);x.fill();for(let j=0;j<3;j++)r(a+6,78-h/2+j*10,2,4,(i+j)%3?'#3b425a':'#bb7eb8')}r(0,65,78,132,'#343746');for(let y=70;y<195;y+=13){r(3,y,75,1,'#202637');for(let a=8+(y%2)*10;a<75;a+=22)r(a,y,1,13,'#22283a')}x.fillStyle='#101522';x.beginPath();x.moveTo(84,195);x.lineTo(84,82);x.quadraticCurveTo(84,44,119,44);x.quadraticCurveTo(154,44,154,82);x.lineTo(154,195);x.fill();x.strokeStyle='#5c5a6b';x.lineWidth=5;x.stroke();r(390,0,90,198,'#343342');for(let y=8;y<197;y+=14){r(391,y,89,1,'#202536');for(let a=398+(y%2)*12;a<480;a+=26)r(a,y,1,14,'#242a3a')}for(let i=0;i<40;i++)r(400+i*17%75,20+i*31%165,3,4,i%2?'#4c665d':'#344d4a');r(0,194,W,76,'#202635');r(0,194,W,3,'#656274');for(let y=200;y<H;y+=13){r(0,y,W,1,'#35394a');for(let a=(y%2)*19;a<W;a+=39)r(a,y,1,13,'#303546')}for(let i=0;i<20;i++){let a=(i*37+t*.7)%W,b=207+i*13%55;r(a,b,12,1,'#69748a');r(a+4,b+2,5,1,'#8a7198')}for(let a of [58,419]){r(a,75,2,23,'#171827');r(a-4,72,10,12,'#65496c');r(a-2,74,6,8,'#ffb8e7')}}
function hero(){let a=Math.round(p.x),b=Math.round(p.y),s=p.m?Math.sin(p.walk*1.25)*2:0,bob=p.m?Math.abs(Math.sin(p.walk*1.25)):0;x.fillStyle='#070913aa';x.beginPath();x.ellipse(a,b+13,10,3,0,0,7);x.fill();x.save();x.translate(a,b-bob);x.save();let ang=p.dir==='left'?2.5:p.dir==='right'?.3:p.dir==='up'?-0.8:.7;x.translate(p.dir==='left'?-7:7,0);x.rotate(ang);r(-1,3,3,7,'#5a5365');r(-4,7,8,2,'#d2d4e8');r(-1,-22,3,25,'#c9d4e7');r(0,-21,1,21,'#f3f3ff');r(-2,-24,5,2,'#e7e9f7');x.restore();r(-5+s,3,4,9,'#171a2a');r(1-s,3,4,9,'#171a2a');r(-6+s,12,6,3,'#090b16');r(0-s,12,7,3,'#090b16');r(-7,-10,14,15,'#080b16');r(-9,-8,4,10,'#111321');r(5,-8,4,10,'#111321');r(-6,-11,12,4,'#1b1c2d');r(-3,-17,6,5,'#e8c4c5');r(-5,-26,10,11,'#e9c9ca');r(-6,-27,12,5,'#e5e7f3');r(-6,-24,3,9,'#f4f1f8');r(3,-24,3,9,'#c8ccdf');r(-4,-21,3,1,'#35364c');r(2,-21,2,1,'#35364c');r(-7,-27,3,17,'#d8dced');r(-8,-22,3,14,'#f0eff7');r(4,-27,3,14,'#d6d8e9');r(5,-20,3,13,'#b9c0d8');r(-6,-29,12,3,'#11111e');r(-5,-30,10,2,'#e8e9f4');r(4,-26,2,3,'#87d9f1');r(-3,-9,6,1,'#aaa5c2');for(let i=-6;i<=5;i+=3)r(i,3,2,1,'#a9a7bf');x.restore()}
function draw(){x.setTransform(c.width/W,0,0,c.height/H,0,0);x.imageSmoothingEnabled=false;bg();x.strokeStyle='#a5c0df88';x.lineWidth=.6;for(let q of rain){x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-1,q.y+q.l);x.stroke();q.y+=q.v;q.x-=.25;if(q.y>H){q.y=-5;q.x=Math.random()*W}}hero();x.fillStyle='#b6bfd00a';for(let i=0;i<4;i++)x.fillRect((t*5+i*143)%(W+100)-50,175+i*17,75,5)}
function update(dt){t+=dt;let dx=0,dy=0;if(k.w||k.arrowup)dy--;if(k.s||k.arrowdown)dy++;if(k.a||k.arrowleft)dx--;if(k.d||k.arrowright)dx++;p.m=!!(dx||dy);if(p.m){let n=Math.hypot(dx,dy),v=(k.shift?70:43)*dt;p.x+=dx/n*v;p.y+=dy/n*v;p.walk+=dt*9;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}p.x=Math.max(17,Math.min(W-17,p.x));p.y=Math.max(53,Math.min(H-15,p.y));document.querySelector('#status').textContent=p.m?'Yürüyüş · '+p.dir:'Gothic Rain · Prototype 01'}
function loop(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}function start(){run=true;document.querySelector('#start').style.display='none'}document.querySelector('#play').onclick=start;addEventListener('keydown',e=>{let a=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(a))e.preventDefault();k[a]=true;if(a==='enter')start()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=false);addEventListener('blur',()=>Object.keys(k).forEach(a=>k[a]=false));document.querySelectorAll('[data-k]').forEach(b=>{let a=b.dataset.k,down=e=>{e.preventDefault();k[a]=true},up=e=>{e.preventDefault();k[a]=false};b.onpointerdown=down;b.onpointerup=up;b.onpointercancel=up;b.onpointerleave=up});requestAnimationFrame(loop)})();
</script></body></html>
